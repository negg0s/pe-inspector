[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-inspector"
version = "0.1.0"
description = "A small CLI for inspecting Windows PE (Portable Executable) files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "negg0s" }]
dependencies = [
    "click>=8.0",
    "pefile>=2023.2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pe-inspector = "pe_inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]