[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-inspector"
version = "0.1.0"
description = "A small CLI for inspecting Windows PE (Portable Executable) files."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "negg0s" }]
keywords = ["windows", "pe", "pefile", "portable-executable", "analyzer", "reverse-engineering", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "pefile>=2023.2.7",
]

[project.urls]
Homepage = "https://github.com/negg0s/pe-inspector"
Repository = "https://github.com/negg0s/pe-inspector.git"
Issues = "https://github.com/negg0s/pe-inspector/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pe-inspector = "pe_inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]