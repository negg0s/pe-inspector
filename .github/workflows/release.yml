name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build

      - name: Build Distribution Packages (Wheel and Sdist)
        shell: cmd
        run: python -m build

      - name: Generate Checksums
        shell: powershell
        run: |
          Get-FileHash -Algorithm SHA256 dist/* | ForEach-Object {
            "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content -Path "dist/checksums-sha256.txt" -Encoding utf8
          Get-Content "dist/checksums-sha256.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
